spring.application.name=bookapp
server.port=8081

# MySQL DB connection - values come from environment variables, never commit real passwords
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookapp?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT - set JWT_SECRET to your own Base64 key (at least 32 bytes) in production
app.jwt.secret=${JWT_SECRET:c3VwZXJzZWN1cmUyNTZiaXRqd3RrZXlfcGxlYXNlX2NoYW5nZSE=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# Frontend URLs allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5175}
